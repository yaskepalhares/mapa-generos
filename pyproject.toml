[project]
name = "mapa-generos"
version = "0.0.1"
description = "Mapa em rede dos gêneros das músicas curtidas no Spotify, via Last.fm"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "networkx>=3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
