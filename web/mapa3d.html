<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de gêneros 3D</title>
  <!-- Experimento: versão 3D do mapa. Lê os mesmos grafo.json e faixas.json
       da página principal (index.html), que não depende deste arquivo. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --fundo: #000;
      --painel: rgba(14, 14, 20, 0.86);
      --borda: rgba(255, 255, 255, 0.09);
      --texto: #e8e8ee;
      --apagado: #9a9aa8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--fundo); color: var(--texto);
      font: 14px/1.4 Inter, system-ui, -apple-system, sans-serif;
    }
    #mapa { position: fixed; inset: 0; }
    #topo, #painel {
      position: fixed; z-index: 10;
      background: var(--painel); border: 1px solid var(--borda); border-radius: 12px;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    #topo { top: 16px; left: 16px; width: 300px; max-width: calc(100vw - 32px); padding: 12px 14px; }
    #topo h1 { margin: 0; font-size: 17px; font-weight: 600; }
    .titulo { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .vista { display: flex; flex: none; }
    .vista button {
      font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; padding: 2px 9px;
      color: var(--texto); background: rgba(255, 255, 255, 0.07); border: 1px solid var(--borda);
    }
    .vista button:hover { background: rgba(255, 255, 255, 0.13); }
    .vista button:first-child { border-radius: 7px 0 0 7px; }
    .vista button:last-child { border-radius: 0 7px 7px 0; border-left: 0; }
    .vista button.ativa { background: rgba(185, 185, 255, 0.2); border-color: rgba(185, 185, 255, 0.5); }
    #resumo, .nota { margin: 2px 0 10px; color: var(--apagado); font-size: 12px; }
    .nota { margin: 8px 0 0; }
    .nota a { color: var(--apagado); }
    input[type="search"] {
      width: 100%; background: rgba(255, 255, 255, 0.06); color: var(--texto);
      border: 1px solid var(--borda); border-radius: 8px; padding: 7px 9px; font: inherit;
    }
    .alternar { display: flex; gap: 4px; margin-top: 10px; }
    .alternar button {
      flex: 1; font: inherit; font-size: 12px; color: var(--apagado); cursor: pointer;
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--borda); border-radius: 8px; padding: 6px;
    }
    .alternar button.ativa { color: #fff; background: rgba(255, 255, 255, 0.14); }
    #legenda { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 10px; font-size: 11.5px; color: var(--apagado); }
    #legenda span::before {
      content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
      margin-right: 5px; background: var(--c); box-shadow: 0 0 6px var(--c);
    }
    #painel {
      top: 16px; right: 16px; bottom: 16px; width: 360px; max-width: calc(100vw - 32px);
      padding: 14px 16px; overflow-y: auto;
    }
    #painel h2 { margin: 0 24px 2px 0; font-size: 18px; font-weight: 600; }
    #fechar { position: absolute; top: 10px; right: 12px; background: none; border: 0;
      color: var(--apagado); font-size: 20px; cursor: pointer; }
    #p-meta { color: var(--apagado); font-size: 12px; margin: 0 0 8px; }
    #p-familias { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
    #p-rel { font-size: 12.5px; color: var(--apagado); margin: 0 0 10px; }
    #p-rel a, #p-titulo a { color: var(--texto); cursor: pointer; text-decoration: none; }
    #p-rel a:hover { text-decoration: underline; }
    #p-titulo { font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
    #p-faixas { list-style: none; margin: 0; padding: 0; }
    #p-faixas li { display: flex; gap: 8px; padding: 5px 0; border-top: 1px solid var(--borda); font-size: 12.5px; }
    #p-faixas a { color: var(--texto); text-decoration: none; }
    #p-faixas a:hover { text-decoration: underline; }
    .art { display: block; color: var(--apagado); font-size: 11.5px; }
    .peso { flex: 0 0 26px; height: 4px; margin-top: 7px; background: rgba(255, 255, 255, 0.08); border-radius: 2px; }
    .peso i { display: block; height: 100%; background: #fff; opacity: 0.6; border-radius: 2px; }
    .rotulo {
      color: rgba(255, 255, 255, 0.86); font-weight: 600; white-space: nowrap; pointer-events: none;
      text-shadow: 0 0 3px #000, 0 0 6px #000, 0 0 10px #000;
    }
    .rotulo.apagado { opacity: 0.12 !important; }
    .float-tooltip-kap {
      background: var(--painel) !important; border: 1px solid var(--borda);
      border-radius: 8px !important; padding: 4px 8px !important;
      font: 12.5px/1.35 Inter, system-ui, sans-serif !important; color: var(--texto) !important;
    }
    .float-tooltip-kap small { color: var(--apagado); }
    @media (max-width: 720px) {
      #painel { top: auto; height: 55vh; }
    }
  </style>
</head>
<body>
  <div id="mapa"></div>

  <header id="topo">
    <div class="titulo">
      <h1>Mapa de gêneros</h1>
      <div class="vista" role="group" aria-label="Vista">
        <button data-vista="2d">2D</button>
        <button data-vista="3d" class="ativa">3D</button>
      </div>
    </div>
    <p id="resumo">carregando…</p>
    <input id="busca" type="search" list="lista-generos" placeholder="Buscar gênero…" autocomplete="off">
    <datalist id="lista-generos"></datalist>
    <div class="alternar">
      <button id="ar-cooc" class="ativa">Coocorrência</button>
      <button id="ar-hier">Hierarquia</button>
      <button id="ar-nada">Sem arestas</button>
    </div>
    <div id="legenda"></div>
    <p class="nota">Arraste para girar · roda para zoom · botão direito para mover</p>
  </header>

  <aside id="painel" hidden>
    <button id="fechar" title="Fechar">×</button>
    <h2 id="p-nome"></h2>
    <p id="p-meta"></p>
    <div id="p-familias"></div>
    <p id="p-rel"></p>
    <p id="p-titulo"></p>
    <ol id="p-faixas"></ol>
  </aside>

  <!-- As dependências do 3d-force-graph no jsDelivr pedem versões diferentes do
       three.js (0.186.1 e 0.187.0); o import map faz todas usarem a mesma. -->
  <script type="importmap">
    { "imports": { "https://cdn.jsdelivr.net/npm/three@0.187.0/": "https://cdn.jsdelivr.net/npm/three@0.186.1/" } }
  </script>
  <script type="module" src="mapa3d.js"></script>
</body>
</html>
